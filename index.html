<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Ball-Knife Circus</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div id="game">
            <div id="character"></div>
        </div>
        
        <div class="sidebar">
            <h1 class="game-title">Drop Ball</h1>
            
            <div class="score-box">
                <h2>Skor</h2>
                <div id="score" class="score-value">0</div>
            </div>
            
            <div class="tutorial-box">
                <h3>📖 Cara Bermain</h3>
                <div class="tutorial-content">
                    <div class="tutorial-item">
                        <strong>🎯 Tujuan:</strong>
                        <p>Hindari blok hitam yang jatuh</p>
                    </div>
                    <div class="tutorial-item">
                        <strong>⌨️ Kontrol:</strong>
                        <p>◀️ Panah Kiri<br>▶️ Panah Kanan</p>
                    </div>
                    <div class="tutorial-item">
                        <strong>💡 Tips:</strong>
                        <p>Lewati hole putih di blok</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
